[workspace]
resolver = "3"
members = ["crates/stellar-core", "crates/stellar-cli", "crates/stellar-app"]
default-members = ["crates/stellar-app"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
stellar-core = { path = "crates/stellar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
rfd = "0.17"

# The solver is numerically heavy: keep it fast even in debug/test builds.
[profile.dev]
opt-level = 1

[profile.dev.package.stellar-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
